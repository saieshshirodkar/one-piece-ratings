<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Piece Episodes Rating</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #121212; /* Dark background */
            padding: 20px;
            color: #e0e0e0; /* Light text */
        }
        
        h1 {
            text-align: center;
            color: #ff7961; /* Lighter red for dark mode */
            margin-bottom: 30px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .episode {
            background-color: #1e1e1e; /* Darker card background */
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5); /* Adjusted shadow for dark mode */
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            height: 120px;
        }
        
        .episode:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.6); /* Adjusted hover shadow */
        }
        
        .ep-number {
            font-weight: bold;
            font-size: 1.2em;
            margin-bottom: 5px;
            /* Text color set by JS based on rating bg */
        }
        
        .ep-title {
            font-size: 0.9em;
            flex-grow: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
             /* Text color set by JS based on rating bg */
        }
        
        .ep-rating {
            font-size: 1.1em;
            font-weight: bold;
            text-align: right;
            margin-top: 5px;
             /* Text color set by JS based on rating bg */
        }
        
        .rating-legend {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            margin-right: 10px;
            color: #e0e0e0; /* Light legend text */
        }
        
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 3px;
            margin-right: 5px;
        }
        
        .loading {
            text-align: center;
            font-size: 1.2em;
            padding: 50px;
            color: #e0e0e0; /* Light loading text */
        }
        
        .toggle-button {
            display: block;
            margin: 0 auto 20px auto;
            padding: 10px 20px;
            font-size: 1em;
            cursor: pointer;
            background-color: #333;
            color: #e0e0e0;
            border: 1px solid #555;
            border-radius: 5px;
        }
        
        .toggle-button:hover {
            background-color: #444;
        }
        
        /* Overall View Specific Styles */
        .grid.overall-view {
            grid-template-columns: repeat(auto-fill, minmax(45px, 1fr)); /* Smaller columns */
            gap: 5px; /* Smaller gap */
        }
        
        .grid.overall-view .episode {
            height: 45px; /* Square boxes */
            padding: 0;
            justify-content: center; /* Center content vertically */
            align-items: center; /* Center content horizontally */
        }
        
        .grid.overall-view .ep-number {
            font-size: 0.8em;
            margin: 0; /* Remove margin */
            text-align: center;
        }
        
        .grid.overall-view .ep-title,
        .grid.overall-view .ep-rating {
            display: none; /* Hide title and rating */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>One Piece Episodes Rating</h1>
        
        <div class="rating-legend">
            <div class="legend-item">
                <div class="legend-color" style="background-color: #1b5e20;"></div>
                <span>9.0+</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background-color: #4caf50;"></div>
                <span>8.5-8.9</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background-color: #ffeb3b;"></div>
                <span>8.0-8.4</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background-color: #ff9800;"></div>
                <span>7.5-7.9</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background-color: #e65100;"></div>
                <span>7.0-7.4</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background-color: #b71c1c;"></div>
                <span>Below 7.0</span>
            </div>
        </div>
        
        <button id="toggle-view" class="toggle-button">Show Overall View</button>
        
        <div id="episode-grid" class="grid">
            <div class="loading">Loading episodes...</div>
        </div>
    </div>

    <script>
        // Load episode data from external JSON file
        let episodesData = [];
        
        // Function to determine color based on rating - Updated to match legend
        function getRatingColor(rating) {
            if (rating >= 9.0) return "#1b5e20"; // Dark Green (from legend)
            if (rating >= 8.5) return "#4caf50"; // Lighter Green (from legend)
            if (rating >= 8.0) return "#ffeb3b"; // Yellow (from legend)
            if (rating >= 7.5) return "#ff9800"; // Orange (from legend)
            if (rating >= 7.0) return "#e65100"; // Darker Orange (from legend)
            return "#b71c1c"; // Dark Red (from legend)
        }

        // Function to display episodes
        function displayEpisodes() {
            const grid = document.getElementById('episode-grid');
            grid.innerHTML = ''; // Clear loading message
            
            episodesData.forEach(episode => {
                // Correctly access episode number and convert rating to a number
                const episodeNumber = episode.episode; 
                const ratingValue = parseFloat(episode.rating);
                
                const episodeEl = document.createElement('div');
                episodeEl.className = 'episode';
                const bgColor = getRatingColor(ratingValue);
                episodeEl.style.backgroundColor = bgColor;
                
                // Adjust text color based on background for better contrast with the new scheme
                // Use dark text only for the light yellow background
                const textColor = (ratingValue >= 8.0 && ratingValue < 8.5) ? '#111' : '#fff';
                episodeEl.style.color = textColor;
                
                episodeEl.innerHTML = `
                    <div class="ep-number">${episodeNumber}</div>
                    <div class="ep-title">${episode.title}</div>
                    <div class="ep-rating">Rating: ${ratingValue.toFixed(1)}</div>
                `;
                
                grid.appendChild(episodeEl);
            });
        }

        // --- Toggle View Logic ---
        const toggleButton = document.getElementById('toggle-view');
        const episodeGrid = document.getElementById('episode-grid');

        toggleButton.addEventListener('click', () => {
            episodeGrid.classList.toggle('overall-view');
            
            // Update button text based on the current view
            if (episodeGrid.classList.contains('overall-view')) {
                toggleButton.textContent = 'Show Expanded View';
            } else {
                toggleButton.textContent = 'Show Overall View';
            }
        });
        // --- End Toggle View Logic ---

        // Fetch data from JSON file and display episodes
        fetch('one_piece_s1_ratings_selenium.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(data => {
                episodesData = data;
                displayEpisodes();
            })
            .catch(error => {
                console.error('Error loading episode data:', error);
                document.getElementById('episode-grid').innerHTML = 
                    `<div class="loading" style="color: red">Error loading data: ${error.message}</div>`;
            });
    </script>
</body>
</html>
